  <script>
    window.__EDUCASHPRO_PAGE_BUILD__="2026.10.05.2";

    // Os arquivos possuem versão própria; o próximo acesso recebe a publicação nova.
    if("serviceWorker" in navigator){
      Promise.resolve().then(function(){

  <style>
    html,body{margin:0;min-height:100%;background:#07111f;color:#f7fbff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}

    .splash p{color:#9db0c6}.loader{width:180px;height:4px;overflow:hidden;border-radius:9px;background:#12243b}.loader span{display:block;width:40%;height:100%;background:#30e6a6;animation:boot-loading 1.1s infinite ease-in-out}

  <script>
    // Ponte mínima de entrada: já funciona enquanto os módulos maiores ainda estão carregando.
    (function(){
      function norm(value){
        return String(value||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
          .replace(/[\s\u00a0]+/g," ").replace(/[🚀◇◆✉️📧🔐🔑]/g,"").trim().toLowerCase();
      }
      var emailLabels=new Set(["entrar","acessar o educashpro","acessar educashpro","entrar com e-mail","entrar com email","sign in","access educashpro","sign in with email","acceder a educashpro","entrar con correo","войти","войти по e-mail"]);
      var telegramLabels=new Set(["entrar pelo telegram","abrir no telegram","abrir app no telegram","open in telegram","open telegram","open app in telegram","entrar por telegram","abrir en telegram","abrir app en telegram","открыть в telegram","войти через telegram"]);
      function publicContext(target){
        if(!target||target.closest&&target.closest(".webAuthLayer"))return false;
        if(target.matches&&target.matches("[data-educash-entry],[data-entry-action]"))return true;
        return Boolean(target.closest&&target.closest("header,.topbar,.publicWelcome,.landing,.landingHero,.hero,[data-public-landing]"));
      }
      function telegramUrl(){
        var params=new URL(location.href).searchParams;
        var ref=String(params.get("ref")||params.get("r")||"").trim();
        var url=new URL("https://t.me/EduCashProBot");
        url.searchParams.set("startapp",ref?"ref_"+ref:"site");
        return url.toString();
      }
      function request(mode){
        var api=window.EduCashProWebEntry;
        if(mode==="telegram"){location.assign(telegramUrl());return}
        if(api&&typeof api.open==="function"){api.open();return}
        window.__EDUCASHPRO_ENTRY_PENDING__="account";
        try{window.dispatchEvent(new CustomEvent("educashpro:entry-request",{detail:{mode:"account"}}))}catch(_){}
      }
      document.addEventListener("click",function(event){
        var target=event.target&&event.target.closest&&event.target.closest("button,a,[role='button']");
        if(!target||target.closest&&target.closest(".webAuthLayer"))return;
        var explicit=String(target.dataset&&((target.dataset.educashEntry||target.dataset.entryAction))||"").toLowerCase();
        var label=norm(target.textContent||target.getAttribute&&target.getAttribute("aria-label")||"");
        var telegram=explicit==="telegram"||telegramLabels.has(label);
        if(telegram){
          var href=String(target.getAttribute&&target.getAttribute("href")||"");
          if(/^https:\/\/t\.me\//i.test(href))return;
          event.preventDefault();event.stopImmediatePropagation();request("telegram");return;
        }
        var email=explicit==="email"||explicit==="account"||emailLabels.has(label);
        var strongEmail=label==="acessar o educashpro"||label==="acessar educashpro"||label==="access educashpro"||label==="acceder a educashpro";
        if(!email||(!explicit&&!strongEmail&&!publicContext(target)))return;
        event.preventDefault();event.stopImmediatePropagation();request("account");
      },true);
    })();
  </script>
  <script>
    window.__EDUCASHPRO_BOOT__={startedAt:Date.now(),initStarted:false,appReady:false,telegramReady:false,telegramSdkTimedOut:false,scriptErrors:[]};
    window.addEventListener("error",function(event){var source=event&&event.target&&event.target.src;if(!source)return;window.__EDUCASHPRO_BOOT__.scriptErrors.push(source);console.error("[EduCashPro] Falha ao carregar recurso:",source)},true);
    (function(){
      var root=document.documentElement;
      var ios=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
      var standalone=window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches===true||window.navigator.standalone===true;
      var launchText=String(location.search||"")+" "+String(location.hash||"");
      var telegramHint=/tgWebApp(?:Data|Version|Platform|ThemeParams)/i.test(launchText);
      window.__EDUCASHPRO_TELEGRAM_HINT__=telegramHint;
      if(ios)root.classList.add("educashproIOS");
      if(standalone)root.classList.add("educashproStandalone");
      root.classList.add("educashproWeb");
      function syncTelegram(){
        try{
          var webApp=window.Telegram&&window.Telegram.WebApp;
          var initData=String(webApp&&webApp.initData||"");
          root.classList.toggle("educashproTelegram",Boolean(initData));
          root.classList.toggle("educashproWeb",!initData);
          if(!webApp)return;
          webApp.ready();webApp.expand();window.__EDUCASHPRO_BOOT__.telegramReady=true;
          var safeTop=Number(webApp.contentSafeAreaInset&&webApp.contentSafeAreaInset.top||webApp.safeAreaInset&&webApp.safeAreaInset.top||0);
          if(Number.isFinite(safeTop)&&safeTop>=0)root.style.setProperty("--ecp-telegram-safe-top",safeTop+"px");
          root.classList.toggle("educashproTelegramFullscreen",webApp.isFullscreen===true);
        }catch(error){console.error("[EduCashPro] Telegram bootstrap:",error)}
      }
      window.__EDUCASHPRO_SYNC_TELEGRAM__=syncTelegram;
      document.addEventListener("DOMContentLoaded",syncTelegram,{once:true});
      if(telegramHint){
        window.__EDUCASHPRO_TELEGRAM_SDK_PROMISE__=new Promise(function(resolve){
          var script=document.createElement("script");
          var settled=false;
          function settle(ok){
            if(settled)return;
            settled=true;
            window.__EDUCASHPRO_BOOT__.telegramSdkTimedOut=!ok;
            resolve(Boolean(ok));
          }
          function announceReady(){
            window.__EDUCASHPRO_BOOT__.telegramSdkTimedOut=false;
            syncTelegram();
            try{window.dispatchEvent(new CustomEvent("educashpro:telegram-sdk-ready"))}catch(_){}
          }
          script.src="https://telegram.org/js/telegram-web-app.js";
          script.async=true;
          script.onload=function(){announceReady();settle(true)};
          script.onerror=function(){settle(false)};
          document.head.appendChild(script);
          window.setTimeout(function(){
            var ok=Boolean(window.Telegram&&window.Telegram.WebApp);
            if(ok)announceReady();
            settle(ok);
          },5000);
        });
      }else{
        window.__EDUCASHPRO_TELEGRAM_SDK_PROMISE__=Promise.resolve(false);
      }
    })();
  </script>
