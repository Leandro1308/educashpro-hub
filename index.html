<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>EduCashPro</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    window.__EDUCASHPRO_BOOT__ = {
      startedAt: Date.now(),
      telegramReady: false,
      scriptErrors: []
    };

    window.addEventListener("error", function (event) {
      var source = event && event.target && event.target.src;
      if (!source) return;
      window.__EDUCASHPRO_BOOT__.scriptErrors.push(source);
      console.error("[EduCashPro] Falha ao carregar recurso:", source);
    }, true);

    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        window.__EDUCASHPRO_BOOT__.telegramReady = true;
      }
    } catch (error) {
      console.error("[EduCashPro] Falha ao sinalizar inicialização ao Telegram:", error);
    }
  </script>
  <link rel="stylesheet" href="./style.css?v=20260906.1" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brandmark">E</div>
      <div class="brandcopy">
        <strong>EduCashPro</strong>
        <span id="headerSubtitle">Seu universo em um só lugar</span>
      </div>
      <button id="closeButton" class="iconButton" aria-label="Fechar">✕</button>
    </header>

    <main id="content" class="content">
      <section class="splash">
        <div class="splashLogo">E</div>
        <h1>EduCashPro</h1>
        <p id="loadingText">Organizando sua experiência…</p>
        <div class="loader"><span></span></div>
      </section>
    </main>

    <nav id="bottomNav" class="bottomNav hidden" aria-label="Navegação principal">
      <button data-view="home" class="active"><span>🏠</span><small data-i18n="navHome">Início</small></button>
      <button data-view="learn"><span>🎓</span><small data-i18n="navLearn">Aprender</small></button>
      <button data-view="explore"><span>🔎</span><small data-i18n="navExplore">Explorar</small></button>
      <button data-view="benefits"><span>🎁</span><small data-i18n="navBenefits">Benefícios</small></button>
      <button data-view="area"><span>❤️</span><small data-i18n="navArea">Minha área</small></button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <div id="accessModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modalBackdrop" data-close-modal></div>
    <section class="modalSheet">
      <button class="modalClose" data-close-modal aria-label="Fechar">✕</button>
      <div id="modalIcon" class="modalIcon">🎓</div>
      <h2 id="modalTitle"></h2>
      <p id="modalDescription"></p>
      <ul id="modalLearning"></ul>
      <button id="modalSubscribe" class="wideButton"></button>
      <button class="secondaryButton modalCancel" data-close-modal></button>
    </section>
  </div>
  <script defer src="./technical-analysis-course.js?v=20260904.1"></script>
  <script defer src="./official-community-access.js?v=20260906.1"></script>
  <script defer src="./local-tools-and-games.js?v=20260906.1"></script>
  <script defer src="./link-tools.js?v=20260904.2"></script>
  <script defer src="./app.js?v=20260906.1"></script>
  <script defer src="./business-21st-century-course.js?v=20260904.1"></script>
  <script defer src="./course-final-notice.js?v=20260904.1"></script>
  <script defer src="./video-course-access.js?v=20260904.1"></script>
  <script defer src="./visitor-experience.js?v=20260906.1"></script>
  <script async src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    window.setTimeout(function () {
      if (window.__EDUCASHPRO_APP_STARTED__) return;
      var loadingText = document.getElementById("loadingText");
      var loader = document.querySelector(".splash .loader");
      if (loader) loader.hidden = true;
      if (loadingText) {
        loadingText.classList.add("error");
        loadingText.textContent = "Não foi possível iniciar. Feche e abra novamente pelo botão do EduCashPro.";
      }
      console.error("[EduCashPro] Tempo limite de inicialização excedido.", window.__EDUCASHPRO_BOOT__);
    }, 15000);
  </script>
</body>
</html>
