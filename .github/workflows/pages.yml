name: Deploy EduCashPro Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: educashpro-hub-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar ambiente de produção
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tests/' \
            --exclude 'preview-dual-mode/' \
            --exclude 'README.md' \
            --exclude 'LINKS_API_CONTRACT.md' \
            --exclude '_site/'
      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Diagnosticar origem pública
        shell: bash
        run: |
          set +e
          echo "=== HTTPS HEADERS ==="
          curl -sSIL --connect-timeout 10 https://go.educashpro.vip/ | sed -n '1,80p'
          echo "=== HTTP HEADERS ==="
          curl -sSIL --connect-timeout 10 http://go.educashpro.vip/ | sed -n '1,80p'
          echo "=== HTTPS ROOT HTML ==="
          curl -sSL --connect-timeout 10 https://go.educashpro.vip/ | sed -n '1,140p'
          echo "=== HTTPS FILE PROBES ==="
          for path in version.json game-suite.js educash-empire-v12.js resource-loader.js; do
            echo "--- /${path} ---"
            curl -sS -D - --connect-timeout 10 "https://go.educashpro.vip/${path}?probe=${GITHUB_SHA}" -o "/tmp/${path//\//_}" | sed -n '1,40p'
            head -c 500 "/tmp/${path//\//_}" 2>/dev/null
            echo
          done
          echo "=== DNS / CONNECT TRACE ==="
          curl -svI --connect-timeout 10 https://go.educashpro.vip/ 2>&1 | sed -n '1,120p'
