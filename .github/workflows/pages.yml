name: Deploy EduCashPro Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: educashpro-hub-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar ambiente de produção
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tests/' \
            --exclude 'preview-dual-mode/' \
            --exclude 'README.md' \
            --exclude 'LINKS_API_CONTRACT.md' \
            --exclude '_site/'
          test -s _site/index.html
          test -s _site/resource-loader.js
          test -s _site/subscription-coherence.js
          test -s _site/market-learning-center.js
          test -s _site/market-learning-center-v20261027.js
          test -s _site/resource-loader-v20261028-product.js
          test -s _site/price-action-trainer.js
          test -s _site/price-action-data.js
          test -s _site/price-action-trainer.css
          grep -Fq 'id="marketPriceAction"' _site/market-learning-center-v20261027.js
          grep -Fq 'src="./resource-loader-v20261028-product.js' _site/index.html
          grep -Fq 'window.EduCashProPriceAction' _site/price-action-trainer.js
      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Validar entrega real do domínio e diagnosticar DNS
        shell: bash
        run: |
          set -uo pipefail
          host="go.educashpro.vip"
          expected="$(python3 -c 'import json; print(json.load(open("version.json"))["build"])')"
          echo "Build esperado: ${expected}"
          echo "DNS CNAME: $(dig +short CNAME "${host}" | tr '\n' ' ')"
          echo "DNS A: $(dig +short A "${host}" | tr '\n' ' ')"
          echo "DNS AAAA: $(dig +short AAAA "${host}" | tr '\n' ' ')"
          failed=0
          for attempt in 1 2 3; do
            echo "Verificação de entrega ${attempt}/3"
            for path in "index.html" "version.json" "product-shell.js" "link-tools.js" "resource-loader-v20261028-product.js"; do
              output="/tmp/ecp-live-$(basename "${path}")"
              url="https://${host}/${path}?build=${expected}&attempt=${attempt}&sha=${GITHUB_SHA}"
              code="$(curl -L -sS --connect-timeout 10 --max-time 20 -o "${output}" -w '%{http_code}' "${url}" || true)"
              echo "GET /${path}: HTTP ${code}"
              if [[ "${code}" != "200" ]]; then
                failed=1
                continue
              fi
              case "${path}" in
                index.html)
                  grep -Fq "__EDUCASHPRO_PAGE_BUILD__=\"${expected}\"" "${output}" || { echo "::warning::HTML está desatualizado"; failed=1; }
                  ;;
                version.json)
                  grep -Fq "\"build\":\"${expected}\"" "${output}" || { echo "::warning::version.json desatualizado ou inválido"; failed=1; }
                  ;;
                product-shell.js)
                  grep -Fq "card('qr','▦',c.qr,c.qrSub)" "${output}" || { echo "::warning::Menu QR ausente na entrega"; failed=1; }
                  ;;
                link-tools.js)
                  grep -Fq 'function bindInlineQr()' "${output}" || { echo "::warning::QR da Página de Links ausente na entrega"; failed=1; }
                  ;;
                resource-loader-v20261028-product.js)
                  grep -Fq 'const VERSION="20261101.3"' "${output}" || { echo "::warning::Carregador desatualizado"; failed=1; }
                  ;;
              esac
            done
            if [[ "${failed}" -eq 0 ]]; then
              echo "Domínio confirmou o build e os dois acessos ao QR Code."
              exit 0
            fi
            [[ "${attempt}" == "3" ]] || sleep 8
            failed=0
          done
          echo "::error::GitHub Pages publicou, mas o domínio personalizado não entregou os arquivos esperados. Verifique o DNS/proxy/hosting do domínio."
          exit 1
