name: Deploy EduCashPro Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: educashpro-hub-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar ambiente de produção
        run: |
          mkdir -p _site
          rsync -a ./ _site/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tests/' \
            --exclude 'preview-dual-mode/' \
            --exclude 'README.md' \
            --exclude 'LINKS_API_CONTRACT.md' \
            --exclude '_site/'
          test -s _site/index.html
          test -s _site/resource-loader.js
          test -s _site/subscription-coherence.js
          test -s _site/market-learning-center.js
          test -s _site/market-learning-center-v20261027.js
          test -s _site/resource-loader-v20261028-product.js
          test -s _site/price-action-trainer.js
          test -s _site/price-action-data.js
          test -s _site/price-action-trainer.css
          grep -Fq 'id="marketPriceAction"' _site/market-learning-center-v20261027.js
          grep -Fq 'src="./resource-loader-v20261028-product.js' _site/index.html
          grep -Fq 'window.EduCashProPriceAction' _site/price-action-trainer.js
      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verificar publicação sem expor conteúdo e infraestrutura
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          for path in "" "version.json" "resource-loader.js"; do
            code="$(curl -L -sS --connect-timeout 10 --max-time 20 -o /dev/null -w '%{http_code}' "https://go.educashpro.vip/${path}?probe=${GITHUB_SHA}" || true)"
            echo "Resource /${path} HTTP ${code}"
            if [[ "${code}" != "200" ]]; then failed=1; fi
          done
          if [[ "${failed}" != "0" ]]; then
            echo "::warning::Domínio ainda não serve todos os recursos; verifique DNS/Render. Nenhum corpo HTML, cookie ou cabeçalho sensível será registrado."
          fi

          # HTTP 200 alone is insufficient: custom domains may return stale scripts
          # or an HTML fallback for assets that are absent.
          trainer_live=0
          for attempt in 1 2 3 4; do
            if curl -L -f -sS --connect-timeout 10 --max-time 25 \
                -o /tmp/educashpro-market-live.js \
                "https://go.educashpro.vip/market-learning-center-v20261027.js?deploy=${GITHUB_SHA}&attempt=${attempt}" \
              && grep -Fq 'id="marketPriceAction"' /tmp/educashpro-market-live.js; then
              trainer_live=1
              echo "Price Action Trainer confirmed in published versioned market asset"
              break
            fi
            echo "Price Action Trainer not confirmed on custom domain (attempt ${attempt}/4)"
            if [[ "${attempt}" != "4" ]]; then sleep 10; fi
          done
          if [[ "${trainer_live}" != "1" ]]; then
            echo "::warning::Novo Treinador de Price Action ainda não está visível pelo domínio; verifique cache/CDN/DNS."
          fi

