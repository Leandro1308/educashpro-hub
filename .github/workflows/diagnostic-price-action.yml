name: Diagnose Price Action public deployment
on:
  pull_request:
    paths:
      - ".github/workflows/diagnostic-price-action.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Compare public delivery and GitHub Pages with source
        shell: bash
        run: |
          set -u
          echo "Public DNS (IPv4):"
          getent ahostsv4 go.educashpro.vip | head -6 || true
          echo "GitHub Pages DNS (IPv4):"
          getent ahostsv4 leandro1308.github.io | head -3 || true
          for base in "https://go.educashpro.vip" "https://leandro1308.github.io/educashpro-hub"; do
            echo "::group::Origin: ${base}"
            for path in "/" "/version.json" "/resource-loader-v20261027.js" "/market-learning-center-v20261027.js" "/market-learning-center.js" "/app"; do
              echo "PATH ${path}"
              curl --location --silent --show-error --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' -o /tmp/check.txt -w 'STATUS %{http_code} FINAL %{url_effective} IP %{remote_ip} TYPE %{content_type} BYTES %{size_download}\n' "${base}${path}?diagnose=20261027-unique-45" || true
              for token in "2026.10.27.3" "marketPriceAction" "trainerAvailable" "resource-loader-v20261027.js" "marketExnessInvite"; do
                if grep -Fq "${token}" /tmp/check.txt; then echo "MATCH ${token} yes"; else echo "MATCH ${token} no"; fi
              done
              echo "CHARCOUNT $(wc -c </tmp/check.txt)"
            done
            echo "::endgroup::"
          done

          echo "::group::Actual app route assets and scripts"
          curl -L -sS --max-time 20 "https://go.educashpro.vip/app/" -o /tmp/live-app.html || true
          echo "SCRIPT SOURCES in /app/ HTML:"
          grep -oE 'src="[^"]+\.js[^"]*"' /tmp/live-app.html | head -70 || true
          for path in "/app/version.json" "/app/resource-loader.js" "/app/market-learning-center.js" "/app/resource-loader-v20261027.js" "/app/market-learning-center-v20261027.js" "/app/index.html" "/app/app.js"; do
            echo "APP PATH ${path}"
            curl -LsS --connect-timeout 8 --max-time 20 -o /tmp/actual-app-asset -w 'STATUS %{http_code} FINAL %{url_effective} TYPE %{content_type} BYTES %{size_download}\n' "https://go.educashpro.vip${path}?diag=actual-20261027" || true
            for token in "2026.10.27.3" "marketPriceAction" "trainerAvailable" "resource-loader-v20261027.js" "marketExnessInvite"; do
              if grep -Fq "${token}" /tmp/actual-app-asset; then echo "FOUND ${token}"; fi
            done
          done
          echo "::endgroup::"
