name: Verify published finance and Back fixes
on:
  pull_request:
    paths:
      - ".github/workflows/verify-finance-navigation-live.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Render production build and repaired assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://go.educashpro.vip/app"
          nonce="${GITHUB_SHA}-${GITHUB_RUN_ATTEMPT}"
          for asset in version.json navigation-flow.js resource-loader.js local-tools-and-games.js monthly-finance-control.js web-site-menu.js support.js; do
            curl -L -f -sS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 35 \
              -H 'Cache-Control: no-cache' "$base/$asset?verify=$nonce" -o "/tmp/verify-$asset"
            echo "Published: $asset $(wc -c <"/tmp/verify-$asset") bytes"
          done
          node -e 'const v=require("/tmp/verify-version.json");if(v.build!=="2026.10.27.7")throw Error("Expected build 2026.10.27.7 but got "+v.build);console.log("Live build:",v.build)'
          grep -Fq 'button.matches("[data-navigation-back]")' /tmp/verify-navigation-flow.js
          grep -Fq 'loadFinanceExtras' /tmp/verify-resource-loader.js
          grep -Fq 'finance_model_unavailable' /tmp/verify-resource-loader.js
          grep -Fq 'toolLoadRetry' /tmp/verify-local-tools-and-games.js
          grep -Fq 'shareInitializedForView' /tmp/verify-monthly-finance-control.js
          grep -Fq 'route.view==="home"' /tmp/verify-web-site-menu.js
          grep -Fq 'internalReferrer' /tmp/verify-support.js
          node --check /tmp/verify-navigation-flow.js
          node --check /tmp/verify-local-tools-and-games.js
          node --check /tmp/verify-monthly-finance-control.js
          echo "PASS: Real Render domain publishes updated Back and offline finance recovery scripts"
