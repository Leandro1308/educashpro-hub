name: Build static Set for Life lessons in four languages
on:
  pull_request:
    branches: [main]
    paths:
      - 'set-for-life-part*.js'
      - 'scripts/build-set-for-life-i18n.py'
permissions:
  contents: write
jobs:
  translate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/set-for-life-free-course'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        language: [en, es, ru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'argostranslate>=1.9,<2'
      - name: Build educational content in selected language
        run: python scripts/build-set-for-life-i18n.py --language ${{ matrix.language }}
      - uses: actions/upload-artifact@v4
        with:
          name: set-for-life-${{ matrix.language }}
          path: set-for-life-${{ matrix.language }}.js
          if-no-files-found: error
  commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/set-for-life-free-course'
    needs: [translate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: set-for-life-*
          merge-multiple: true
      - name: Verify assets and commit
        run: |
          test -s set-for-life-en.js
          test -s set-for-life-es.js
          test -s set-for-life-ru.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add set-for-life-en.js set-for-life-es.js set-for-life-ru.js
          git diff --cached --quiet || (git commit -m "feat(academy): four-language Set for Life lessons" && git push origin HEAD:${{ github.event.pull_request.head.ref }})
