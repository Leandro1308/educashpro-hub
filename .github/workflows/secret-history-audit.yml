name: Secret History Audit
on:
  push:
    branches: [security/history-secret-scanning-20261008]
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scan committed history without printing credentials
        run: node scripts/scan-secret-history.mjs
