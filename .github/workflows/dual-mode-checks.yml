name: Dual Mode Frontend Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check dual-mode modules
        run: |
          node --check platform-adapter.js
          node --check platform-web-auth.js
          node --check web-auth-entry.js
          node --check account-center.js
          node --check admin-center.js
          node --check navigation-state.js
          node --check feature-registry.js
          node --check resource-loader.js
          node --check market-learning-center.js
          node --check local-tools-and-games.js
          node --check app.js
          node --check tests/dual-mode-audit.mjs
          node --check tests/static-audit.mjs

      - name: Run dual-mode audit
        run: node tests/dual-mode-audit.mjs
      - name: Run static audit
        run: node tests/static-audit.mjs
      - name: Verify HttpOnly transport fallback
        run: node tests/cookie-transport.test.mjs
      - name: Verify guided book quiz content and chapter progress
        run: node tests/book-quiz.test.mjs
      - name: Verify Set for Life curriculum in all four languages
        run: node tests/set-for-life.test.mjs

      - name: Verify offline Price Action
        run: node tests/price-action-trainer.test.mjs



      - name: Verify original book collection in four languages
        run: node tests/original-books.test.mjs
