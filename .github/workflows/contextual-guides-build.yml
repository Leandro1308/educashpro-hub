name: Generate static contextual help translations
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  translate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/contextual-help-four-languages'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        language: [en, es, ru]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'argostranslate>=1.9,<2'
      - name: Generate translated guide assets
        run: python scripts/build-contextual-guides.py --language ${{ matrix.language }}
      - uses: actions/upload-artifact@v4
        with:
          name: contextual-help-${{ matrix.language }}
          path: contextual-guides-${{ matrix.language }}.js
          if-no-files-found: error
  commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/contextual-help-four-languages'
    needs: [translate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: contextual-help-*
          merge-multiple: true
      - name: Confirm the three language assets
        run: |
          test -s contextual-guides-en.js
          test -s contextual-guides-es.js
          test -s contextual-guides-ru.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contextual-guides-en.js contextual-guides-es.js contextual-guides-ru.js
          git diff --cached --quiet || (git commit -m "feat(help): translated novice guides into EN ES RU" && git push origin HEAD:${{ github.event.pull_request.head.ref }})
