  <title>Agenda Profissional | EduCashPro</title>
  <script>
    (function(){
      var launchText=String(location.search||"")+" "+String(location.hash||"");
      var hint=/tgWebApp(?:Data|Version|Platform|ThemeParams)/i.test(launchText);
      window.__EDUCASHPRO_TELEGRAM_HINT__=hint;
      if(!hint){window.__EDUCASHPRO_TELEGRAM_SDK_PROMISE__=Promise.resolve(false);return}
      window.__EDUCASHPRO_TELEGRAM_SDK_PROMISE__=new Promise(function(resolve){
        var script=document.createElement("script"),settled=false;
        function finish(ok){if(settled)return;settled=true;resolve(Boolean(ok))}
        script.src="https://telegram.org/js/telegram-web-app.js";
        script.async=true;
        script.onload=function(){finish(true)};
        script.onerror=function(){finish(false)};
        document.head.appendChild(script);
        setTimeout(function(){finish(Boolean(window.Telegram&&window.Telegram.WebApp))},3000);
      });
    })();
  </script>
  <link rel="stylesheet" href="./agenda.css?v=7">
  <link rel="stylesheet" href="./common-ui.css?v=1">
</head>
