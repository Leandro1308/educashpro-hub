<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maze Muncher · EduCashPro</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07111f;color:#fff;font-family:system-ui;display:grid;place-items:center;padding:12px}.w{width:min(96vw,560px);text-align:center}.maze{display:grid;grid-template-columns:repeat(15,1fr);aspect-ratio:1;background:#061321;border:2px solid #30e6a6}.x{display:grid;place-items:center;font-size:clamp(8px,3vw,16px)}.wall{background:#173f73}.dot:after{content:"·";color:#ffd166;font-size:20px}.player{background:#30e6a6;border-radius:40%;color:#05131a}.goal{background:#8a5cf5}.controls{display:grid;grid-template-columns:repeat(3,58px);justify-content:center;gap:6px;margin:12px}.controls button,.a button{min-height:48px;border:0;border-radius:12px;background:#11243a;color:#fff;font-size:20px;font-weight:900}.controls .up{grid-column:2}.controls .left{grid-column:1}.controls .down{grid-column:2}.controls .right{grid-column:3}.a{display:flex;gap:8px}.a button{flex:1;font-size:14px}.m{min-height:24px;color:#ffd166;font-weight:800}</style></head><body><main class="w"><h1>🟡 <span id="title"></span></h1><p id="sub"></p><div class="m" id="msg"></div><section class="maze" id="maze"></section><div class="controls"><button class="up" data-d="-1,0">▲</button><button class="left" data-d="0,-1">◀</button><button class="down" data-d="1,0">▼</button><button class="right" data-d="0,1">▶</button></div><div class="a"><button id="newBtn"></button><button id="backBtn"></button></div></main><script>
(function(){var l=new URLSearchParams(location.search).get('lang')||'pt',C={pt:['Maze Muncher','Colete os pontos e alcance a saída.','Pontos restantes: ','Concluído!','Novo labirinto','Voltar'],en:['Maze Muncher','Collect the dots and reach the exit.','Dots left: ','Completed!','New maze','Back'],es:['Maze Muncher','Recoge los puntos y llega a la salida.','Puntos restantes: ','¡Completado!','Nuevo laberinto','Volver'],ru:['Лабиринт','Соберите точки и доберитесь до выхода.','Осталось точек: ','Готово!','Новый лабиринт','Назад']}[l]||null;if(!C)C=['Maze Muncher','','Dots left: ','Completed!','New maze','Back'];
var el={title:document.getElementById('title'),sub:document.getElementById('sub'),msg:document.getElementById('msg'),maze:document.getElementById('maze'),newBtn:document.getElementById('newBtn'),backBtn:document.getElementById('backBtn')};el.title.textContent=C[0];el.sub.textContent=C[1];el.newBtn.textContent=C[4];el.backBtn.textContent='← '+C[5];el.backBtn.onclick=function(){parent.postMessage({type:'educashpro:classic-back'},location.origin)};
var raw=[
'###############',
'#.............#',
'#.###.#####.#.#',
'#...#.....#.#.#',
'###.#####.#.#.#',
'#...#...#.#...#',
'#.###.#.#.###.#',
'#.....#.#.....#',
'#.#####.#####.#',
'#.#.........#.#',
'#.#.#######.#.#',
'#.#.#.....#.#.#',
'#...#.###.#...#',
'#.....#.......G',
'###############'];
var grid=[],p={r:1,c:1},dots=0;function start(){grid=raw.map(function(s){return s.split('')});p={r:1,c:1};dots=0;for(var r=0;r<15;r++)for(var c=0;c<15;c++)if(grid[r][c]==='.')dots++;draw()}
function move(dr,dc){var nr=p.r+dr,nc=p.c+dc,v=grid[nr]&&grid[nr][nc];if(!v||v==='#')return;p={r:nr,c:nc};if(v==='.'){grid[nr][nc]=' ';dots--}if(v==='G'&&dots===0)el.msg.textContent=C[3];draw()}
function draw(){el.maze.innerHTML='';for(var r=0;r<15;r++)for(var c=0;c<15;c++){var x=document.createElement('div'),v=grid[r][c];x.className='x '+(v==='#'?'wall':v==='.'?'dot':v==='G'?'goal':'')+(p.r===r&&p.c===c?' player':'');x.textContent=p.r===r&&p.c===c?'●':v==='G'?'★':'';el.maze.appendChild(x)}if(!(grid[p.r][p.c]==='G'&&dots===0))el.msg.textContent=C[2]+dots}
document.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){var a=b.dataset.d.split(',').map(Number);move(a[0],a[1])}});addEventListener('keydown',function(e){var m={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(m){e.preventDefault();move(m[0],m[1])}});el.newBtn.onclick=start;start();
})();</script></body></html>
