<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connect Four · EduCashPro</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07111f;color:#fff;font-family:system-ui;display:grid;place-items:center;padding:14px}.w{width:min(96vw,560px);text-align:center}.board{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;background:#1450a3;border-radius:20px}.cell{aspect-ratio:1;border-radius:50%;background:#061321;border:2px solid rgba(255,255,255,.08)}.r{background:#ff5b66}.y{background:#ffd54a}.cols{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}.cols button{min-height:38px;border:0;border-radius:10px;background:#30e6a6;font-weight:900}.a{display:flex;gap:8px}.a button{flex:1;min-height:48px;border:0;border-radius:13px;background:#11243a;color:#fff;font-weight:900}.msg{min-height:28px;color:#ffd166;font-weight:800}</style></head><body><main class="w"><h1>🔴🟡 <span id="title"></span></h1><p id="sub"></p><div class="msg" id="msg"></div><div class="cols" id="cols"></div><section class="board" id="board"></section><div class="a"><button id="newBtn"></button><button id="backBtn"></button></div></main><script>
(function(){var l=new URLSearchParams(location.search).get('lang')||'pt',C={pt:['Connect Four','Forme quatro peças em linha. Você é vermelho.','Sua vez','Você venceu!','Computador venceu.','Empate.','Novo jogo','Voltar'],en:['Connect Four','Connect four pieces. You are red.','Your turn','You won!','Computer won.','Draw.','New game','Back'],es:['Cuatro en Línea','Forma cuatro fichas. Eres rojo.','Tu turno','¡Ganaste!','Ganó la computadora.','Empate.','Nuevo juego','Volver'],ru:['Четыре в ряд','Соберите четыре. Вы играете красными.','Ваш ход','Вы победили!','Компьютер победил.','Ничья.','Новая игра','Назад']}[l]||null;if(!C)C=['Connect Four','','Your turn','You won!','Computer won.','Draw.','New game','Back'];title.textContent=C[0];sub.textContent=C[1];newBtn.textContent=C[6];backBtn.textContent='← '+C[7];backBtn.onclick=function(){parent.postMessage({type:'educashpro:classic-back'},location.origin)};
var R=6,K=7,g=[],over=false;function reset(){g=Array.from({length:R},function(){return Array(K).fill('')});over=false;msg.textContent=C[2];draw()}
function drop(c,p){for(var r=R-1;r>=0;r--)if(!g[r][c]){g[r][c]=p;return r}return-1}function win(p){for(var r=0;r<R;r++)for(var c=0;c<K;c++)for(var d of [[0,1],[1,0],[1,1],[1,-1]]){var ok=true;for(var n=0;n<4;n++){var rr=r+d[0]*n,cc=c+d[1]*n;if(rr<0||rr>=R||cc<0||cc>=K||g[rr][cc]!==p){ok=false;break}}if(ok)return true}return false}
function end(p){if(win(p)){over=true;msg.textContent=p==='R'?C[3]:C[4];return true}if(g[0].every(Boolean)){over=true;msg.textContent=C[5];return true}return false}
function human(c){if(over||drop(c,'R')<0)return;if(end('R'))return draw();draw();setTimeout(ai,220)}function ai(){if(over)return;var valid=[];for(var c=0;c<K;c++)if(!g[0][c])valid.push(c);var pick=valid[Math.floor(Math.random()*valid.length)];for(var x of valid){var r=drop(x,'Y');if(win('Y')){pick=x;g[r][x]='';break}g[r][x]=''}if(pick===undefined)return;drop(pick,'Y');end('Y');draw()}
function draw(){board.innerHTML='';for(var r=0;r<R;r++)for(var c=0;c<K;c++){var e=document.createElement('div');e.className='cell '+(g[r][c]==='R'?'r':g[r][c]==='Y'?'y':'');board.appendChild(e)}cols.innerHTML='';for(let c=0;c<K;c++){var b=document.createElement('button');b.textContent='▼';b.disabled=over||!!g[0][c];b.onclick=function(){human(c)};cols.appendChild(b)}}newBtn.onclick=reset;reset();
})();</script></body></html>
