<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Merge Drop · EduCashPro</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07111f;color:#fff;font-family:system-ui;display:grid;place-items:center;padding:14px}.w{width:min(94vw,470px);text-align:center}.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}.cols button{min-height:42px;border:0;border-radius:10px;background:#30e6a6;color:#05131a;font-weight:900}.board{display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(8,1fr);gap:6px;background:#0d1b2d;padding:8px;border-radius:18px;min-height:430px}.cell{display:grid;place-items:center;border-radius:14px;background:#11243a;font-size:22px;font-weight:900}.v2{background:#24455d}.v4{background:#2c6d68}.v8{background:#8b6d31}.v16{background:#9f5933}.v32{background:#8b4358}.v64{background:#6d4d94}.v128,.v256,.v512,.v1024,.v2048{background:#2b8b65}.a{display:flex;gap:8px;margin-top:10px}.a button{flex:1;min-height:48px;border:0;border-radius:13px;background:#11243a;color:#fff;font-weight:900}.m{min-height:26px;color:#ffd166;font-weight:800}</style></head><body><main class="w"><h1>🔢 <span id="title"></span></h1><p id="sub"></p><div class="m" id="msg"></div><div class="cols" id="cols"></div><section class="board" id="board"></section><div class="a"><button id="newBtn"></button><button id="backBtn"></button></div></main><script>
(function(){var l=new URLSearchParams(location.search).get('lang')||'pt',C={pt:['Merge Drop','Solte números iguais na mesma coluna para combiná-los.','Pontos: ','Fim da partida','Novo jogo','Voltar'],en:['Merge Drop','Drop equal numbers in the same column to merge them.','Score: ','Game over','New game','Back'],es:['Merge Drop','Suelta números iguales en la misma columna para combinarlos.','Puntos: ','Fin de la partida','Nuevo juego','Volver'],ru:['Merge Drop','Бросайте одинаковые числа в один столбец, чтобы объединять их.','Очки: ','Игра окончена','Новая игра','Назад']}[l]||null;if(!C)C=['Merge Drop','','Score: ','Game over','New game','Back'];
var E={title:document.getElementById('title'),sub:document.getElementById('sub'),msg:document.getElementById('msg'),cols:document.getElementById('cols'),board:document.getElementById('board'),newBtn:document.getElementById('newBtn'),backBtn:document.getElementById('backBtn')};E.title.textContent=C[0];E.sub.textContent=C[1];E.newBtn.textContent=C[4];E.backBtn.textContent='← '+C[5];E.backBtn.onclick=function(){parent.postMessage({type:'educashpro:classic-back'},location.origin)};
var R=8,K=5,g,score,over;function reset(){g=Array.from({length:R},function(){return Array(K).fill(0)});score=0;over=false;draw()}
function drop(c){if(over||g[0][c])return;var r=R-1;while(r>=0&&g[r][c])r--;g[r][c]=Math.random()<.78?2:4;score+=g[r][c];while(r<R-1&&g[r+1][c]===g[r][c]){g[r+1][c]*=2;score+=g[r+1][c];g[r][c]=0;r++;}if(g[0].every(Boolean)){over=true;E.msg.textContent=C[3]}draw()}
function draw(){E.board.innerHTML='';for(var r=0;r<R;r++)for(var c=0;c<K;c++){var v=g[r][c],x=document.createElement('div');x.className='cell '+(v?'v'+v:'');x.textContent=v||'';E.board.appendChild(x)}E.cols.innerHTML='';for(let c=0;c<K;c++){var b=document.createElement('button');b.textContent='▼';b.disabled=over||!!g[0][c];b.onclick=function(){drop(c)};E.cols.appendChild(b)}if(!over)E.msg.textContent=C[2]+score}E.newBtn.onclick=reset;reset();
})();</script></body></html>
