<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dino Run · EduCashPro</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#07111f;color:#fff;font-family:system-ui;display:grid;place-items:center;padding:14px}.w{width:min(96vw,620px);text-align:center}canvas{width:100%;height:auto;background:linear-gradient(#102b43,#07111f);border:1px solid #28435f;border-radius:18px;touch-action:none}.a{display:flex;gap:8px;margin-top:10px}.a button{flex:1;min-height:48px;border:0;border-radius:13px;background:#11243a;color:#fff;font-weight:900}.a button:first-child{background:#30e6a6;color:#05131a}.m{min-height:25px;color:#ffd166;font-weight:800}</style></head><body><main class="w"><h1>🦖 <span id="title"></span></h1><p id="sub"></p><div class="m" id="msg"></div><canvas id="cv" width="600" height="260"></canvas><div class="a"><button id="newBtn"></button><button id="backBtn"></button></div></main><script>
(function(){var l=new URLSearchParams(location.search).get('lang')||'pt',C={pt:['Dino Run','Toque na tela para pular os obstáculos.','Pontos: ','Fim da partida · recorde: ','Jogar novamente','Voltar'],en:['Dino Run','Tap the screen to jump over obstacles.','Score: ','Game over · best: ','Play again','Back'],es:['Dino Run','Toca la pantalla para saltar obstáculos.','Puntos: ','Fin · récord: ','Jugar de nuevo','Volver'],ru:['Dino Run','Нажмите на экран, чтобы перепрыгивать препятствия.','Очки: ','Конец игры · рекорд: ','Ещё раз','Назад']}[l]||null;if(!C)C=['Dino Run','','Score: ','Game over · best: ','Play again','Back'];
var E={title:document.getElementById('title'),sub:document.getElementById('sub'),msg:document.getElementById('msg'),cv:document.getElementById('cv'),newBtn:document.getElementById('newBtn'),backBtn:document.getElementById('backBtn')};E.title.textContent=C[0];E.sub.textContent=C[1];E.newBtn.textContent=C[4];E.backBtn.textContent='← '+C[5];E.backBtn.onclick=function(){parent.postMessage({type:'educashpro:classic-back'},location.origin)};
var x=E.cv.getContext('2d'),d,obs,score,run,last=0,best=Number(localStorage.getItem('ecp:dino:best')||0);function reset(){d={x:65,y:190,vy:0};obs=[];score=0;run=true;last=0;E.msg.textContent=C[2]+'0';requestAnimationFrame(loop)}
function jump(){if(!run){reset();return}if(d.y>=189)d.vy=-12}E.cv.addEventListener('pointerdown',jump);addEventListener('keydown',function(e){if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();jump()}});
function end(){run=false;best=Math.max(best,Math.floor(score));localStorage.setItem('ecp:dino:best',best);E.msg.textContent=C[3]+best}
function loop(t){if(!run)return;var dt=Math.min(32,t-last||16);last=t;d.vy+=0.65;d.y+=d.vy;if(d.y>190){d.y=190;d.vy=0}if(Math.random()<0.018)obs.push({x:610,w:18+Math.random()*22,h:25+Math.random()*35});obs.forEach(function(o){o.x-=6+score/500});obs=obs.filter(function(o){return o.x>-50});for(var o of obs)if(d.x+34>o.x&&d.x<o.x+o.w&&d.y+42>220-o.h){end();return}score+=dt/100;x.clearRect(0,0,600,260);x.fillStyle='#28435f';x.fillRect(0,220,600,3);x.fillStyle='#30e6a6';x.fillRect(d.x,d.y,34,42);x.fillStyle='#ff8f70';obs.forEach(function(o){x.fillRect(o.x,220-o.h,o.w,o.h)});x.fillStyle='#fff';x.font='18px system-ui';x.fillText(C[2]+Math.floor(score),18,28);E.msg.textContent=C[2]+Math.floor(score);requestAnimationFrame(loop)}E.newBtn.onclick=reset;reset();
})();</script></body></html>
