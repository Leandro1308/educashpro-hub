en:"<h2>Financial and educational tools</h2><p>EduCashPro calculators, simulators, trackers, projections, informative quotes and other tools provide informational and educational results. Values shown are estimates based on user-provided data and platform formulas. They are not exact figures, outcome guarantees, promises of return, tax documents, invoices or payment obligations.</p><p>The user is responsible for entered data and how results are used. When a decision requires professional, legal, accounting, tax, financial or equivalent validation, the user is responsible for obtaining appropriate specialist guidance.</p>",
es:"<h2>Herramientas financieras y educativas</h2><p>Las calculadoras, simuladores, controles, proyecciones, presupuestos informativos y demás herramientas de EduCashPro ofrecen resultados informativos y educativos. Los valores son estimaciones basadas en los datos del usuario y en las fórmulas de la plataforma. No representan cifras exactas, garantías de resultado, promesas de rentabilidad, documentos fiscales, facturas u obligaciones de pago.</p><p>El usuario es responsable de los datos ingresados y del uso de los resultados. Cuando una decisión requiera validación profesional, legal, contable, tributaria, financiera o equivalente, corresponde al usuario obtener la orientación especializada adecuada.</p>",
ru:"<h2>Финансовые и образовательные инструменты</h2><p>Калькуляторы, симуляторы, учёт, прогнозы, информационные сметы и другие инструменты EduCashPro предоставляют информационные и образовательные результаты. Значения являются оценочными и основаны на данных пользователя и формулах платформы. Они не являются точными цифрами, гарантией результата, обещанием доходности, налоговым документом, счётом или обязательством по оплате.</p><p>Пользователь отвечает за введённые данные и использование результатов. Если требуется профессиональная, юридическая, бухгалтерская, налоговая, финансовая или иная специализированная проверка, пользователь самостоятельно обращается за соответствующей консультацией.</p>"
};
function setLang(l){document.documentElement.lang=l==="pt"?"pt-BR":l;document.getElementById("title").textContent=title[l];document.getElementById("terms").innerHTML=text[l]}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>setLang(b.dataset.l));const l=(navigator.language||"pt").slice(0,2);setLang(text[l]?l:"pt");
